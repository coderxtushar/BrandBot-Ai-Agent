name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brandbot
          POSTGRES_PASSWORD: brandbot
          POSTGRES_DB: brandbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brandbot" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -r requirements-dev.txt
      - name: Tests (SQLite, fake AI and platforms)
        run: pytest -q
      - name: Migrations on Postgres (up, matches models, down)
        env:
          DATABASE_URL: postgresql+asyncpg://brandbot:brandbot@localhost:5432/brandbot
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck  # generates Next's route types (LayoutProps, ...) first
      - run: npm run build
        env:
          API_ORIGIN: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
