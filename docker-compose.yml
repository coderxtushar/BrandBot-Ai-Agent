# Local Postgres for Brand Bot.
#   docker compose up -d
#   DATABASE_URL=postgresql+asyncpg://brandbot:brandbot@localhost:5432/brandbot
#   alembic upgrade head
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brandbot
      POSTGRES_PASSWORD: brandbot
      POSTGRES_DB: brandbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandbot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
